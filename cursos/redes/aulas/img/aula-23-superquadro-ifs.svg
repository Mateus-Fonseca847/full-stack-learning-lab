<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 351" width="680" height="351" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Superquadro e espaços entre quadros (IFS)</title>
<desc id="d">Linha do tempo de um superquadro com beacon, CFP, CF-End e CP; abaixo, SIFS, PIFS e DIFS em barras proporcionais, com slot de 9 microssegundos e SIFS de 16.</desc>
<defs></defs>
<rect x="0.5" y="0.5" width="679" height="350" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="20" y="40" width="70" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="55.0" y="64.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">Beacon</text>
<rect x="90" y="40" width="190" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="185.0" y="64.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">CFP (PCF)</text>
<rect x="280" y="40" width="70" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="315.0" y="64.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">CF-End</text>
<rect x="350" y="40" width="230" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="465.0" y="64.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">CP (DCF)</text>
<rect x="580" y="40" width="70" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="615.0" y="64.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">Beacon</text>
<text x="20" y="30" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Superquadro</text>
<text x="20" y="112" font-size="12" text-anchor="start" fill="#2C2C2A">o AP consulta no CFP; as estações disputam no CP</text>
<text x="20" y="152" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">IFS: quanto menor, maior a prioridade</text>
<text x="20" y="190" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">SIFS</text>
<rect x="80" y="172" width="96" height="26" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="186" y="190" font-size="12" text-anchor="start" fill="#2C2C2A">16 µs: ACK, CTS, fragmentos, resposta a polling</text>
<text x="20" y="226" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">PIFS</text>
<rect x="80" y="208" width="96" height="26" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="176" y="208" width="54" height="26" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="240" y="226" font-size="12" text-anchor="start" fill="#2C2C2A">25 µs: beacons e quadros no CFP</text>
<text x="20" y="262" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">DIFS</text>
<rect x="80" y="244" width="96" height="26" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="176" y="244" width="54" height="26" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<rect x="230" y="244" width="54" height="26" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="294" y="262" font-size="12" text-anchor="start" fill="#2C2C2A">34 µs: quadros no CP (DCF)</text>
<text x="20" y="296" font-size="12" text-anchor="start" fill="#2C2C2A">EIFS = SIFS + AckTxTime + DIFS: usado depois de um quadro defeituoso</text>
<rect x="20" y="316" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="40" y="327" font-size="12" text-anchor="start" fill="#2C2C2A">SIFS</text>
<rect x="92" y="316" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="112" y="327" font-size="12" text-anchor="start" fill="#2C2C2A">slot (9 µs)</text>
</svg>
