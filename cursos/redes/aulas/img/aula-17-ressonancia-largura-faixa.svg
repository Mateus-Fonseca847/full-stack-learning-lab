<title id="t">Ressonância e largura de faixa de uma antena</title>
<desc id="d">Curva de potência irradiada por frequência com pico na frequência de ressonância; a largura de faixa é medida onde a potência cai à metade; abaixo da ressonância a antena é capacitiva e acima, indutiva.</desc>
