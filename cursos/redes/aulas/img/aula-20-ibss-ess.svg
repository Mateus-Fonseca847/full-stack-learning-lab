<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">IBSS (ad hoc) e ESS (infraestrutura)</title>
<desc id="d">À esquerda, três estações conversando diretamente em um IBSS sem AP; à direita, dois BSSs, cada um com um AP, ligados por um sistema de distribuição para formar um ESS.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="271" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="105" y="26" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">IBSS (ad hoc)</text>
<text x="105" y="44" font-size="12" text-anchor="middle" fill="#2C2C2A">sem AP, estações se falam direto</text>
<rect x="10" y="62" width="190" height="190" rx="30" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="80" y="80" width="50" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="105.0" y="100.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">E1</text>
<rect x="26" y="190" width="50" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="51.0" y="210.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">E2</text>
<rect x="134" y="190" width="50" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="159.0" y="210.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">E3</text>
<path d="M95 112 L60 190" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<path d="M115 112 L150 190" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<path d="M76 206 L134 206" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="105" y="244" font-size="12" text-anchor="middle" fill="#2C2C2A">IBSS</text>
<text x="460" y="26" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">ESS (estruturada)</text>
<text x="460" y="44" font-size="12" text-anchor="middle" fill="#2C2C2A">BSSs ligados por um DS através de APs</text>
