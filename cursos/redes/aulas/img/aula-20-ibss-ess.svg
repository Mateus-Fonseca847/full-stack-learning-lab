<rect x="320" y="140" width="50" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="345.0" y="159.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">AP</text>
