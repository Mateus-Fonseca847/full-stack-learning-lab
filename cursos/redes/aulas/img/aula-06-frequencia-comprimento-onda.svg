<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" width="680" height="345" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Relação entre frequência e comprimento de onda</title>
<desc id="d">Quatro frequências com o comprimento de onda calculado por 300 dividido pela frequência em MHz: 3 m, 0,3 m, 0,125 m e 0,06 m, em barras de escala logarítmica; as do Wi-Fi em destaque.</desc>
<defs></defs>
<rect x="0.5" y="0.5" width="679" height="344" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="180" y="20" width="320" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="44.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">f (MHz) · λ (m) = 300</text>
<text x="340.0" y="61.2" font-size="12" text-anchor="middle" fill="#2C2C2A">c = 3×10⁸ m/s no vácuo</text>
<text x="20" y="122" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">100 MHz</text>
<rect x="210" y="104" width="315" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="535" y="122" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">λ = 3 m</text>
<text x="20" y="166" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">1 GHz</text>
<rect x="210" y="148" width="165" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="385" y="166" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">λ = 0,3 m</text>
<text x="20" y="210" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">2,4 GHz (Wi-Fi)</text>
<rect x="210" y="192" width="108" height="26" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="328" y="210" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">λ = 0,125 m</text>
<text x="20" y="254" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">5 GHz (Wi-Fi)</text>
<rect x="210" y="236" width="60" height="26" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="280" y="254" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">λ = 0,06 m</text>
<text x="210" y="292" font-size="12" text-anchor="start" fill="#2C2C2A">barras em escala logarítmica</text>
<rect x="20" y="310" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="40" y="321" font-size="12" text-anchor="start" fill="#2C2C2A">faixas de Wi-Fi</text>
</svg>
