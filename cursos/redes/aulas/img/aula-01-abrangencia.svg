<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Abrangência geográfica das redes</title>
<desc id="d">Retângulos aninhados mostram PAN dentro de LAN, dentro de MAN, dentro de WAN; à direita, o alcance de cada uma e a SAN.</desc>
<defs></defs>
<rect x="0.5" y="0.5" width="679" height="309" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="20" y="20" width="380" height="270" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="36" y="42" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">WAN</text>
<rect x="50" y="56" width="320" height="214" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="66" y="78" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">MAN</text>
<rect x="80" y="92" width="260" height="158" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="96" y="114" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">LAN</text>
<rect x="110" y="128" width="160" height="100" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="126" y="150" font-size="14" text-anchor="start" fill="#633806" font-weight="500">PAN</text>
<text x="430" y="60" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">PAN</text>
<text x="470" y="60" font-size="12" text-anchor="start" fill="#2C2C2A">área muito reduzida</text>
<text x="430" y="96" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">LAN</text>
<text x="470" y="96" font-size="12" text-anchor="start" fill="#2C2C2A">prédio, casa, escritório</text>
<text x="430" y="132" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">MAN</text>
<text x="470" y="132" font-size="12" text-anchor="start" fill="#2C2C2A">cidade; TV a cabo</text>
<text x="430" y="168" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">WAN</text>
<text x="470" y="168" font-size="12" text-anchor="start" fill="#2C2C2A">país ou continente</text>
<text x="430" y="216" font-size="12" text-anchor="start" fill="#2C2C2A">Alcance cresce de PAN até WAN</text>
<rect x="430" y="236" width="230" height="54" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="545.0" y="259.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">SAN</text>
<text x="545.0" y="276.2" font-size="12" text-anchor="middle" fill="#2C2C2A">servidores e armazenamento</text>
</svg>
