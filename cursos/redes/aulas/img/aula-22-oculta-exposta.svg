<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" width="680" height="408" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Estação oculta e estação exposta</title>
<desc id="d">Quatro estações A, B, C, D em linha. Na estação oculta, A e C transmitem a B sem se ouvir e colidem em B. Na estação exposta, C ouve B e deixa de transmitir a D, embora não atrapalhasse A.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="407" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="20" y="26" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Estação oculta</text>
<text x="150" y="26" font-size="12" text-anchor="start" fill="#2C2C2A">C não ouve A, então transmite a B</text>
<rect x="48" y="48" width="232" height="96" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="196" y="58" width="380" height="76" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="60" y="80" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="85.0" y="101.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">A</text>
<rect x="210" y="80" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="235.0" y="101.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">B</text>
<rect x="360" y="80" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="385.0" y="101.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">C</text>
<rect x="510" y="80" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535.0" y="101.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">D</text>
<path d="M110 97 L208 97" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<path d="M358 97 L262 97" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<circle cx="236" cy="97" r="0.1" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="236" y="160" font-size="12" text-anchor="middle" fill="#791F1F">colisão em B</text>
<text x="70" y="160" font-size="12" text-anchor="start" fill="#2C2C2A">alcance de A</text>
<text x="500" y="160" font-size="12" text-anchor="end" fill="#2C2C2A">alcance de C</text>
<text x="20" y="226" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Estação exposta</text>
<text x="160" y="226" font-size="12" text-anchor="start" fill="#2C2C2A">C ouve B e deixa de transmitir a D</text>
<rect x="48" y="248" width="380" height="96" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="196" y="258" width="380" height="76" rx="14" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="60" y="280" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="85.0" y="301.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">A</text>
<rect x="210" y="280" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="235.0" y="301.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">B</text>
<rect x="360" y="280" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="385.0" y="301.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">C</text>
<rect x="510" y="280" width="50" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535.0" y="301.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">D</text>
<path d="M208 297 L112 297" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<path d="M412 297 L508 297" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#a5F5E5A)"/>
<text x="340" y="384" font-size="12" text-anchor="middle" fill="#633806">seta tracejada: C espera à toa, pois não atrapalharia A</text>
<text x="70" y="360" font-size="12" text-anchor="start" fill="#2C2C2A">alcance de B</text>
<text x="500" y="360" font-size="12" text-anchor="end" fill="#2C2C2A">alcance de C</text>
</svg>
