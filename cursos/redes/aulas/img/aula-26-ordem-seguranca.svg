<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 377" width="680" height="377" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Opções de segurança Wi-Fi, da mais segura à pior</title>
<desc id="d">Lista vertical de seis opções, de WPA2 com AES no topo até rede aberta no fim, com uma seta indicando que a segurança diminui para baixo.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="376" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="150" y="24" width="340" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="320.0" y="42.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">WPA2 com AES</text>
<text x="320.0" y="59.2" font-size="12" text-anchor="middle" fill="#085041">802.11i, CCMP</text>
<rect x="150" y="76" width="340" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="102.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">WPA com AES</text>
<rect x="150" y="128" width="340" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="154.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">WPA com AES e TKIP</text>
<rect x="150" y="180" width="340" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="198.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">WPA só com TKIP</text>
<text x="320.0" y="215.2" font-size="12" text-anchor="middle" fill="#2C2C2A">RC4</text>
<rect x="150" y="232" width="340" height="44" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="320.0" y="250.9" font-size="14" text-anchor="middle" fill="#791F1F" font-weight="500">WEP</text>
<text x="320.0" y="267.2" font-size="12" text-anchor="middle" fill="#791F1F">não use</text>
<rect x="150" y="284" width="340" height="44" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="320.0" y="302.9" font-size="14" text-anchor="middle" fill="#791F1F" font-weight="500">Rede aberta</text>
<text x="320.0" y="319.2" font-size="12" text-anchor="middle" fill="#791F1F">sem proteção</text>
<path d="M100 30 L100 290" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="92" y="36" font-size="12" text-anchor="end" fill="#2C2C2A">mais seguro</text>
<text x="92" y="292" font-size="12" text-anchor="end" fill="#2C2C2A">pior</text>
<rect x="150" y="342" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="170" y="353" font-size="12" text-anchor="start" fill="#2C2C2A">mais segura</text>
<rect x="271" y="342" width="14" height="14" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="291" y="353" font-size="12" text-anchor="start" fill="#2C2C2A">as piores</text>
</svg>
