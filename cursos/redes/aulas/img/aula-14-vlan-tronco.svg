<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">VLANs, tronco e roteamento entre VLANs</title>
<desc id="d">Dois switches ligados por um tronco 802.1Q com hosts das VLANs 10 e 20; um roteador ou switch L3 liga as VLANs, que não se comunicam entre si apenas no nível 2.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker><marker id="a5F5E5As" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="339" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="40" y="20" width="170" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="125.0" y="44.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">Roteador ou L3</text>
<path d="M125 60 L125 112" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)" marker-start="url(#a5F5E5As)"/>
<text x="135" y="92" font-size="12" text-anchor="start" fill="#2C2C2A">tronco</text>
<rect x="50" y="112" width="150" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="125.0" y="136.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">Switch 1</text>
<rect x="480" y="112" width="150" height="40" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="555.0" y="136.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">Switch 2</text>
<path d="M200 132 L480 132" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)" marker-start="url(#a5F5E5As)"/>
<text x="340" y="122" font-size="12" text-anchor="middle" fill="#2C2C2A">tronco 802.1Q: várias VLANs, com tag</text>
<path d="M70 152 L70 210" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<rect x="20" y="210" width="100" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="70.0" y="230.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Host A</text>
<text x="70.0" y="247.2" font-size="12" text-anchor="middle" fill="#3C3489">VLAN 10</text>
<path d="M170 152 L170 210" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<rect x="140" y="210" width="100" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3"/>
<text x="190.0" y="230.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Host B</text>
<text x="190.0" y="247.2" font-size="12" text-anchor="middle" fill="#3C3489">VLAN 20</text>
<path d="M510 152 L510 210" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<rect x="440" y="210" width="100" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="490.0" y="230.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Host C</text>
<text x="490.0" y="247.2" font-size="12" text-anchor="middle" fill="#3C3489">VLAN 10</text>
<path d="M600 152 L600 210" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<rect x="560" y="210" width="100" height="48" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3"/>
<text x="610.0" y="230.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Host D</text>
<text x="610.0" y="247.2" font-size="12" text-anchor="middle" fill="#3C3489">VLAN 20</text>
<text x="340" y="296" font-size="12" text-anchor="middle" fill="#2C2C2A">cada VLAN é um domínio de broadcast: só a mesma VLAN se comunica no nível 2</text>
<text x="340" y="316" font-size="12" text-anchor="middle" fill="#2C2C2A">tracejado: VLAN 20; contínuo: VLAN 10</text>
</svg>
