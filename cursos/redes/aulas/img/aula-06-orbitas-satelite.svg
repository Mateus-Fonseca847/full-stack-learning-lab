<text x="344" y="82.1" font-size="12" text-anchor="start" fill="#2C2C2A">parece parado; latência alta</text>
<text x="344" y="98.1" font-size="12" text-anchor="start" fill="#2C2C2A">no máximo 180 satélites</text>
