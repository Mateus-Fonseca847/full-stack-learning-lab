<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 396" width="680" height="396" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Colisão e aborto no CSMA/CD</title>
<desc id="d">Diagrama de tempo entre duas estações: A transmite, o sinal demora a chegar a B, B também transmite, os sinais colidem, e cada estação aborta ao detectar a colisão.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker><marker id="aD3D1C7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D3D1C7" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="395" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="90" y="20" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="150.0" y="41.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Estação A</text>
<rect x="470" y="20" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="530.0" y="41.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Estação B</text>
<path d="M150 56 L150 322" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5 3"/>
<path d="M530 56 L530 322" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="144" y="90" width="12" height="210" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="524" y="140" width="12" height="110" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<path d="M156 90 L524 250" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<path d="M524 140 L156 300" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<circle cx="399.4" cy="195.0" r="7" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="399" y="229" font-size="12" text-anchor="middle" fill="#791F1F">colisão</text>
<text x="136" y="98" font-size="12" text-anchor="end" fill="#2C2C2A">A transmite</text>
<text x="136" y="304" font-size="12" text-anchor="end" fill="#2C2C2A">A aborta</text>
<text x="548" y="148" font-size="12" text-anchor="start" fill="#2C2C2A">B transmite</text>
<text x="548" y="254" font-size="12" text-anchor="start" fill="#2C2C2A">B aborta</text>
<path d="M36 74 L36 318" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="20" y="64" font-size="12" text-anchor="start" fill="#2C2C2A">tempo</text>
<text x="340" y="352" font-size="12" text-anchor="middle" fill="#2C2C2A">o sinal de A ainda não chegou a B quando B decide transmitir</text>
<text x="340" y="372" font-size="12" text-anchor="middle" fill="#2C2C2A">cada estação aborta ao detectar a colisão</text>
</svg>
