<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 348" width="680" height="348" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Benefício de fragmentar a mensagem</title>
<desc id="d">Linha do tempo de três enlaces de 1 Mbps: a mensagem inteira leva 36 ms; em três pacotes de 4.000 bits em pipeline leva 20 ms.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker><marker id="a854F0B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#854F0B" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="347" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="20" y="30" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Sem fragmentar: 3 × 12 ms = 36 ms</text>
