<title id="t">Datagramas e circuitos virtuais</title>
<desc id="d">Duas redes lado a lado: em datagramas cada pacote escolhe sua rota pelo endereço de destino; em circuitos virtuais todos seguem o mesmo caminho pelo número do circuito.</desc>
