<text x="571.0" y="108.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">AP</text>
<rect x="52" y="138" width="56" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="80.0" y="156.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Est.</text>
<path d="M108 152 L160 152" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<circle cx="134" cy="140" r="9" fill="#F8F8F6" stroke="#5F5E5A" stroke-width="1"/>
<text x="134" y="144" font-size="12" text-anchor="middle" fill="#2C2C2A">1</text>
<rect x="170" y="124" width="56" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="198.0" y="142.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Est.</text>
<path d="M226 138 L290 138" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<circle cx="258" cy="126" r="9" fill="#F8F8F6" stroke="#5F5E5A" stroke-width="1"/>
<text x="258" y="130" font-size="12" text-anchor="middle" fill="#2C2C2A">2</text>
<rect x="366" y="150" width="56" height="28" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="394.0" y="168.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Est.</text>
<path d="M422 164 L520 164" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#a5F5E5A)"/>
