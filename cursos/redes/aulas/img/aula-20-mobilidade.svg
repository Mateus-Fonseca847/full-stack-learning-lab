<rect x="0.5" y="0.5" width="679" height="313" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="20" y="30" width="440" height="190" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="36" y="52" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">ESS 1</text>
<rect x="480" y="30" width="180" height="190" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="496" y="52" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">ESS 2</text>
