<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314" width="680" height="314" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tipos de mobilidade no 802.11</title>
<desc id="d">Dois ESS: o primeiro com dois BSSs, o segundo com um; três setas numeradas mostram movimento dentro do BSS, para outro BSS do mesmo ESS e para um BSS de outro ESS.</desc>
