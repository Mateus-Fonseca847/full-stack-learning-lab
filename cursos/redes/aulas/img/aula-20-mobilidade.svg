<text x="131.0" y="108.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">AP</text>
<rect x="250" y="80" width="190" height="126" rx="30" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="345.0" y="198" font-size="12" text-anchor="middle" fill="#2C2C2A">BSS 2</text>
<rect x="323.0" y="90" width="44" height="28" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="345.0" y="108.9" font-size="14" text-anchor="middle" fill="#712B13" font-weight="500">AP</text>
<rect x="496" y="80" width="150" height="126" rx="30" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="571.0" y="198" font-size="12" text-anchor="middle" fill="#2C2C2A">BSS 3</text>
