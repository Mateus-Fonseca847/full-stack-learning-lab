<text x="20" y="250" font-size="12" text-anchor="start" fill="#2C2C2A">1 no-transition: a estação se move só dentro do seu BSS</text>
<text x="20" y="270" font-size="12" text-anchor="start" fill="#2C2C2A">2 BSS-transition: vai para outro BSS do mesmo ESS (roaming)</text>
<text x="20" y="290" font-size="12" text-anchor="start" fill="#2C2C2A">3 ESS-transition: vai para um BSS de outro ESS; o padrão não garante</text>
