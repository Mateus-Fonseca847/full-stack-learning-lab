<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Decisão de encaminhamento de uma bridge ou switch</title>
<desc id="d">Fluxograma: o quadro chega por uma porta P, o MAC de origem é aprendido; broadcast vai a todas as portas; unicast com destino na mesma porta é descartado, em outra porta é encaminhado só por ela e desconhecido sofre flooding.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="391" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="220" y="20" width="240" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340.0" y="44.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Chega quadro pela porta P</text>
<path d="M340 60 L340 86" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<rect x="190" y="86" width="300" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="110.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">Aprende MAC de origem → P</text>
<path d="M340 126 L340 152" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<rect x="230" y="152" width="220" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340.0" y="176.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">Destino é broadcast?</text>
<path d="M450 172 L480 172" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="465" y="164" font-size="12" text-anchor="middle" fill="#2C2C2A">sim</text>
<rect x="480" y="152" width="180" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="570.0" y="168.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">Envia a todas</text>
<text x="570.0" y="185.2" font-size="12" text-anchor="middle" fill="#085041">as portas</text>
<path d="M340 192 L340 226" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="352" y="214" font-size="12" text-anchor="start" fill="#2C2C2A">não</text>
<rect x="230" y="226" width="220" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340.0" y="250.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">Destino na tabela?</text>
<path d="M230 246 L120 246 L120 320" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="175" y="238" font-size="12" text-anchor="middle" fill="#2C2C2A">na mesma porta</text>
<path d="M340 266 L340 320" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="352" y="296" font-size="12" text-anchor="start" fill="#2C2C2A">em outra porta</text>
<path d="M450 246 L560 246 L560 320" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="505" y="238" font-size="12" text-anchor="middle" fill="#2C2C2A">em nenhuma</text>
<rect x="20" y="320" width="200" height="52" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120.0" y="342.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Descarta</text>
<text x="120.0" y="359.2" font-size="12" text-anchor="middle" fill="#2C2C2A">filtragem</text>
<rect x="240" y="320" width="200" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340.0" y="342.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">Encaminha</text>
<text x="340.0" y="359.2" font-size="12" text-anchor="middle" fill="#085041">só pela porta do destino</text>
<rect x="460" y="320" width="200" height="52" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="560.0" y="342.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">Flooding</text>
<text x="560.0" y="359.2" font-size="12" text-anchor="middle" fill="#085041">todas as portas, menos P</text>
</svg>
