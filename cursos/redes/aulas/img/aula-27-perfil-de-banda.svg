<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 342" width="680" height="342" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Perfil de banda da Metro Ethernet</title>
<desc id="d">Gráfico de taxa por tempo com a faixa garantida CIR em verde-água e a faixa excedente EIR sem garantia em âmbar; CBS e EBS limitam os bytes de cada faixa; o perfil pode ser por UNI, por EVC ou por CoS.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="341" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<path d="M60 220 L360 220" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<path d="M60 220 L60 36" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="360" y="240" font-size="12" text-anchor="end" fill="#2C2C2A">tempo</text>
<text x="66" y="30" font-size="12" text-anchor="start" fill="#2C2C2A">taxa</text>
<rect x="60" y="130" width="280" height="90" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="60" y="70" width="280" height="60" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="200" y="180" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">CIR</text>
<text x="200" y="104" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">EIR</text>
<rect x="380" y="150" width="280" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="520.0" y="181.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">CIR e CBS</text>
<text x="520.0" y="198.2" font-size="12" text-anchor="middle" fill="#085041">taxa garantida pelo SLA; CBS conta bytes</text>
<rect x="380" y="60" width="280" height="70" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="520.0" y="91.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">EIR e EBS</text>
<text x="520.0" y="108.2" font-size="12" text-anchor="middle" fill="#633806">excedente sem garantia; EBS conta bytes</text>
<text x="20" y="270" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">O perfil de banda pode ser definido por:</text>
<rect x="20" y="286" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="70.0" y="308.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">UNI</text>
<rect x="130" y="286" width="100" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="180.0" y="308.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">EVC</text>
<rect x="240" y="286" width="260" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="370.0" y="308.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">identificador CoS (802.1p)</text>
</svg>
