<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Campos do quadro Ethernet</title>
<desc id="d">Quadro Ethernet com preâmbulo de 8 bytes, destino 6, origem 6, tipo 2, dados de 46 a 1500 e CRC de 4 bytes; o quadro vai de 64 a 1518 bytes sem o preâmbulo; o preâmbulo detalhado em 7 bytes 10101010 e 1 byte 10101011.</desc>
