<text x="201.0" y="83.2" font-size="12" text-anchor="middle" fill="#2C2C2A">6 B</text>
<rect x="243" y="50" width="84" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="285.0" y="66.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Origem</text>
<text x="285.0" y="83.2" font-size="12" text-anchor="middle" fill="#2C2C2A">6 B</text>
<rect x="327" y="50" width="64" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="359.0" y="66.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Tipo</text>
<text x="359.0" y="83.2" font-size="12" text-anchor="middle" fill="#2C2C2A">2 B</text>
<rect x="391" y="50" width="170" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
