<rect x="561" y="50" width="64" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="593.0" y="66.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">CRC</text>
<text x="593.0" y="83.2" font-size="12" text-anchor="middle" fill="#2C2C2A">4 B</text>
<path d="M159 40 L159 34 L391 34 L391 40" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="275.0" y="24" font-size="12" text-anchor="middle" fill="#2C2C2A">cabeçalho: 14 B</text>
<path d="M159 100 L159 108 L625 108 L625 100" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="392.0" y="128" font-size="12" text-anchor="middle" fill="#2C2C2A">quadro: 64 a 1518 B (sem o preâmbulo)</text>
