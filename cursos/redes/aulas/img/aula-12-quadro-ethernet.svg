<text x="115.0" y="190.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">7 bytes 10101010</text>
<text x="115.0" y="207.2" font-size="12" text-anchor="middle" fill="#085041">sincronizam o relógio</text>
<rect x="220" y="168" width="190" height="52" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
