<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 364" width="680" height="364" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Recuo binário exponencial</title>
<desc id="d">Barras em escala logarítmica da janela de sorteio, de 0 a 2^i − 1, depois de 1, 2, 3, 4, 5 e 10 colisões; o teto é 1023 e depois de 16 colisões o controlador desiste.</desc>
<defs></defs>
<rect x="0.5" y="0.5" width="679" height="363" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="20" y="48" font-size="12" text-anchor="start" fill="#2C2C2A">1ª colisão</text>
<rect x="120" y="30" width="38" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="168" y="48" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 1</text>
<text x="20" y="88" font-size="12" text-anchor="start" fill="#2C2C2A">2 colisões</text>
<rect x="120" y="70" width="76" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="206" y="88" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 3</text>
<text x="20" y="128" font-size="12" text-anchor="start" fill="#2C2C2A">3 colisões</text>
<rect x="120" y="110" width="114" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="244" y="128" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 7</text>
<text x="20" y="168" font-size="12" text-anchor="start" fill="#2C2C2A">4 colisões</text>
<rect x="120" y="150" width="152" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="282" y="168" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 15</text>
<text x="20" y="208" font-size="12" text-anchor="start" fill="#2C2C2A">5 colisões</text>
<rect x="120" y="190" width="190" height="26" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="320" y="208" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 31</text>
<text x="20" y="248" font-size="12" text-anchor="start" fill="#2C2C2A">10 colisões</text>
<rect x="120" y="230" width="380" height="26" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="510" y="248" font-size="12" text-anchor="start" fill="#2C2C2A">sorteia de 0 a 1.023  (teto)</text>
<rect x="120" y="270" width="540" height="40" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="390.0" y="294.9" font-size="14" text-anchor="middle" fill="#791F1F" font-weight="500">Depois de 16 colisões: desiste e informa o erro</text>
<text x="20" y="340" font-size="12" text-anchor="start" fill="#2C2C2A">comprimento da barra em escala logarítmica: a janela dobra a cada colisão</text>
</svg>
