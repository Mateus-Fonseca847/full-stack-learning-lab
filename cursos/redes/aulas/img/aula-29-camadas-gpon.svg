<text x="76" y="64" font-size="12" text-anchor="start" fill="#2C2C2A">subcamada de Adaptação</text>
<rect x="76" y="76" width="132" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="142.0" y="102.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">ATM TC</text>
<rect x="220" y="76" width="132" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="286.0" y="102.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">GEM TC</text>
<rect x="364" y="76" width="132" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="430.0" y="102.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">OMCI</text>
<text x="76" y="152" font-size="12" text-anchor="start" fill="#2C2C2A">subcamada Framing GTC</text>
<rect x="76" y="160" width="428" height="70" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="290.0" y="191.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Framing GTC</text>
