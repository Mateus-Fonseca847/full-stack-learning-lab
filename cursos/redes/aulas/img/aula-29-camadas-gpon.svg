<text x="290.0" y="318.2" font-size="12" text-anchor="middle" fill="#2C2C2A">taxa, método, comprimento de onda, split ratio, alcance</text>
<path d="M540 20 L550 20 L550 250 L540 250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="560" y="140" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">enlace</text>
