<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" width="680" height="394" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Camadas do GPON: PMD e GTC</title>
<desc id="d">Pilha de duas camadas, igual na OLT e na ONU: GTC de enlace, com framing e três adaptadores ATM TC, GEM TC e OMCI, sobre a PMD, camada física.</desc>
