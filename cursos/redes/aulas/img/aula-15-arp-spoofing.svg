<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 286" width="680" height="286" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ARP spoofing e man-in-the-middle</title>
<desc id="d">O atacante envia ARP falso à vítima; a vítima passa a mandar ao atacante os dados que iriam ao destino; o atacante captura, altera e reenvia ao destino.</desc>
