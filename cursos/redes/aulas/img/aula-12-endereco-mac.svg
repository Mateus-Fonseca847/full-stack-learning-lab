<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 282" width="680" height="282" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Estrutura do endereço MAC</title>
<desc id="d">Endereço MAC de 48 bits em seis bytes: os três primeiros (24 bits) identificam o fabricante e os três últimos (24 bits) o número da placa; o broadcast tem todos os bits em 1.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="281" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="340" y="28" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">Exemplo: 02-0B-CD-EC-02-26</text>
<rect x="52" y="44" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="97.0" y="68.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">02</text>
<rect x="148" y="44" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="193.0" y="68.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">0B</text>
<rect x="244" y="44" width="90" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="289.0" y="68.9" font-size="14" text-anchor="middle" fill="#085041" font-weight="500">CD</text>
<rect x="340" y="44" width="90" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="385.0" y="68.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">EC</text>
<rect x="436" y="44" width="90" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="481.0" y="68.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">02</text>
<rect x="532" y="44" width="90" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="577.0" y="68.9" font-size="14" text-anchor="middle" fill="#2C2C2A" font-weight="500">26</text>
<path d="M52 96 L52 104 L334 104 L334 96" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M340 96 L340 104 L622 104 L622 96" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="193" y="126" font-size="12" text-anchor="middle" fill="#2C2C2A">24 bits: fabricante (OUI)</text>
<text x="481" y="126" font-size="12" text-anchor="middle" fill="#2C2C2A">24 bits: número da placa</text>
<text x="20" y="178" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Broadcast</text>
<rect x="52" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="97.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<rect x="148" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="193.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<rect x="244" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="289.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<rect x="340" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="385.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<rect x="436" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="481.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<rect x="532" y="192" width="90" height="40" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="577.0" y="216.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">FF</text>
<text x="340" y="258" font-size="12" text-anchor="middle" fill="#2C2C2A">todos os bits em 1: FF-FF-FF-FF-FF-FF</text>
