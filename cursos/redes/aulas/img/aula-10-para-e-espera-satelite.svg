<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 476" width="680" height="476" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Para-e-espera em enlace de satélite</title>
<desc id="d">Diagrama de tempo entre transmissor e receptor: o quadro leva 20 ms para ser enviado e 250 ms de propagação, o ACK volta em mais 250 ms, e o transmissor fica bloqueado 500 de 520 ms.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker><marker id="aD3D1C7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D3D1C7" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="475" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<rect x="140" y="20" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="200.0" y="41.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Transmissor</text>
<rect x="420" y="20" width="120" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="480.0" y="41.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Receptor</text>
<path d="M200 56 L200 373.0" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5 3"/>
<path d="M480 56 L480 373.0" fill="none" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5 3"/>
<rect x="194" y="76.0" width="12" height="11.0" rx="0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<rect x="194" y="87.0" width="12" height="275.0" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="184" y="84.0" font-size="12" text-anchor="end" fill="#2C2C2A">transmite: 20 ms</text>
<text x="184" y="224.5" font-size="12" text-anchor="end" fill="#2C2C2A">bloqueado: 500 ms</text>
<path d="M206 76.0 L480 224.5" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<path d="M480 224.5 L206 362.0" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#a5F5E5A)"/>
<text x="300" y="226" font-size="12" text-anchor="start" fill="#2C2C2A">quadro: 20 + 250 ms</text>
<text x="300" y="336" font-size="12" text-anchor="start" fill="#2C2C2A">ACK: +250 ms</text>
<text x="496" y="228.5" font-size="12" text-anchor="start" fill="#2C2C2A">t = 270 ms: quadro chega</text>
<text x="496" y="366.0" font-size="12" text-anchor="start" fill="#2C2C2A">t = 520 ms: ACK chega</text>
<rect x="170" y="400" width="340" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340.0" y="424.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">Uso do enlace: 20 / 520 ≈ 4%</text>
<text x="340.0" y="441.2" font-size="12" text-anchor="middle" fill="#633806">bloqueado 500 de 520 ms ≈ 96%</text>
</svg>
