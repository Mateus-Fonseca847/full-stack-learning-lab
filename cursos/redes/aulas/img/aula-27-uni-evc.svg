<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" height="444" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">UNI e EVC: E-LINE e E-LAN</title>
<desc id="d">Em cima, uma EVC E-LINE ligando dois clientes por suas UNIs; embaixo, uma EVC E-LAN ligando três clientes; cada UNI tem o lado do cliente, UNI-C, e o lado da rede, UNI-N.</desc>
<defs><marker id="a0F6E56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0F6E56" stroke-width="1.2"/></marker><marker id="a0F6E56s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#0F6E56" stroke-width="1.2"/></marker><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="443" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="20" y="26" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">E-LINE: ponto a ponto</text>
