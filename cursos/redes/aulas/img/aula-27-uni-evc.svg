<path d="M120 100 L130 100" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M550 100 L560 100" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M182 100 L498 100" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#a0F6E56)" marker-start="url(#a0F6E56s)"/>
<text x="340" y="92" font-size="12" text-anchor="middle" fill="#2C2C2A">EVC</text>
<text x="20" y="206" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">E-LAN: multiponto a multiponto</text>
<rect x="190" y="222" width="300" height="150" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 3"/>
<text x="340" y="242" font-size="12" text-anchor="middle" fill="#2C2C2A">rede do provedor</text>
