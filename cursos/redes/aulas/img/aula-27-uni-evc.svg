<text x="70.0" y="314.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Cliente A</text>
<rect x="560" y="250" width="100" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="610.0" y="274.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Cliente B</text>
<rect x="560" y="330" width="100" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="610.0" y="354.9" font-size="14" text-anchor="middle" fill="#3C3489" font-weight="500">Cliente C</text>
<rect x="130" y="296" width="52" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="156.0" y="314.9" font-size="14" text-anchor="middle" fill="#633806" font-weight="500">UNI</text>
