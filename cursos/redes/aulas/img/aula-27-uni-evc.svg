<path d="M550 270 L560 270" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M550 350 L560 350" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M182 310 L340 310 L340 270 L498 270" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="5 3"/>
