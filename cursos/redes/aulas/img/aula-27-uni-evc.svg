<text x="280" y="302" font-size="12" text-anchor="middle" fill="#2C2C2A">EVC</text>
<text x="20" y="400" font-size="12" text-anchor="start" fill="#2C2C2A">UNI: liga a rede do cliente à do provedor; UNI-C é o lado do cliente e UNI-N, o lado da rede</text>
<text x="20" y="420" font-size="12" text-anchor="start" fill="#2C2C2A">EVC: associa duas ou mais UNIs</text>
</svg>
