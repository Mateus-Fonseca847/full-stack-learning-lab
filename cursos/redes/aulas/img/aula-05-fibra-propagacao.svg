<text x="112" y="190" font-size="12" text-anchor="start" fill="#2C2C2A">um só raio, núcleo bem fino</text>
<rect x="200" y="204" width="450" height="100" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="200" y="216" width="450" height="76" rx="0" fill="#F8F8F6" stroke="#5F5E5A" stroke-width="1"/>
<rect x="200" y="248.0" width="450" height="12" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<path d="M200 254 L650 254" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="425" y="330" font-size="12" text-anchor="middle" fill="#2C2C2A">Reflexão interna total: acima do ângulo crítico, a luz volta ao núcleo</text>
<rect x="20" y="350" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="40" y="361" font-size="12" text-anchor="start" fill="#2C2C2A">núcleo e luz</text>
