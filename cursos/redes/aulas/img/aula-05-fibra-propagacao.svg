<text x="188" y="54" font-size="12" text-anchor="end" fill="#2C2C2A">coating</text>
<path d="M190 50 L204 50" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="188" y="68" font-size="12" text-anchor="end" fill="#2C2C2A">casca</text>
<path d="M190 64 L204 64" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="188" y="98" font-size="12" text-anchor="end" fill="#2C2C2A">núcleo</text>
<path d="M190 94 L204 94" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M200 94 L650 94" fill="none" stroke="#854F0B" stroke-width="1"/>
<path d="M210 94 L240 112 L300 76 L360 112 L420 76 L480 112 L540 76 L600 112 L640 94" fill="none" stroke="#854F0B" stroke-width="1"/>
<path d="M210 94 L230 112 L270 76 L310 112 L350 76 L390 112 L430 76 L470 112 L510 76 L550 112 L590 76 L630 112 L650 94" fill="none" stroke="#854F0B" stroke-width="1"/>
