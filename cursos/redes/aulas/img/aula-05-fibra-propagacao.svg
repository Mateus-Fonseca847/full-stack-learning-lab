<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 385" width="680" height="385" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Construção e propagação da luz na fibra óptica</title>
<desc id="d">Corte longitudinal de uma fibra multimodo, com vários raios refletidos, e de uma monomodo, com um só raio no núcleo fino; camadas núcleo, casca e coating identificadas.</desc>
<defs><marker id="a5F5E5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker><marker id="a854F0B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#854F0B" stroke-width="1.2"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="384" rx="8" fill="#F8F8F6" stroke="#D3D1C7"/>
<text x="20" y="30" font-size="14" text-anchor="start" fill="#2C2C2A" font-weight="500">Multimodo</text>
<text x="112" y="30" font-size="12" text-anchor="start" fill="#2C2C2A">vários raios, núcleo mais grosso</text>
<rect x="200" y="44" width="450" height="100" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
