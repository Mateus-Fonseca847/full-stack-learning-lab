<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 386" width="680" height="386" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tipos de onda conforme o caminho</title>
<desc id="d">Esquema em camadas: ionosfera no alto, estratosfera, troposfera e solo; cinco caminhos numerados partem de um transmissor: de superfície, espacial direta, espacial refletida, troposférica e ionosférica.</desc>
