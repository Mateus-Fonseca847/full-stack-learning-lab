<title id="t">Grade de frequências do DWDM</title>
<desc id="d">Cinco canais da grade de 100 GHz em torno de 193,1 THz, com frequência e comprimento de onda calculados; abaixo, os espaçamentos de 200 a 12,5 GHz em escala, mostrando que menor espaçamento cabe mais canais.</desc>
